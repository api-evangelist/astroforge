aid: astroforge
name: AstroForge
description: 'AstroForge is a commercial space startup founded in 2022 and based in Huntington Beach,
  California, focused on asteroid mining and the in-space extraction and refining of platinum group
  metals and other critical minerals. Backed by Initialized Capital and a Y Combinator alum, the company
  designs low-cost, autonomous, replicable interplanetary spacecraft to prospect and mine near-Earth
  asteroids, with its DeepSpace-2 mission targeting the first commercial rendezvous with a body outside
  Earth''s gravity well. AstroForge does not currently publish a public developer API, SDK, or
  documentation surface; this API Evangelist profile tracks the company as a frontier-tech lead and
  will be enriched further if and when a developer program appears.'
